<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زواج - أحمد بن محمد العدني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f5efe6; /* خلفية الشاشة الفاتحة والدافئة بدلاً من الأسود */
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
        }
        .card-container {
            background: #f8f3eb; /* درجة لون كارت الدعوة */
            border: 1.5px solid #d4af37;
            border-radius: 14px;
            max-width: 360px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
            text-align: center;
        }
        .img-wrapper {
            width: 100%;
            max-height: 410px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f3eb;
        }
        .invitation-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .action-area {
            padding: 12px 14px 15px 14px;
            background: #f8f3eb;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.25);
        }
        .btn-location {
            display: block;
            width: 100%;
            padding: 10px 12px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            line-height: 1.4;
            text-align: center;
        }
        .btn-location span {
            display: block;
            text-align: center;
        }
        .btn-text-en {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }
        .btn-location:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5);
        }
        .footer-note {
            margin-top: 10px;
            font-size: 11.5px;
            color: #5a4b3d;
            white-space: nowrap;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- صورة الدعوة الفخمة -->
        <div class="img-wrapper">
            <img src="https://i.postimg.cc/N08NsqLg/ebb55242-d820-4ea0-9277-9c15fe071f5a.jpg" alt="بطاقة دعوة زواج" class="invitation-img">
        </div>
        
        <div class="action-area">
            <!-- زر الموقع -->
            <a href="https://maps.app.goo.gl/Lrt87ZhPtLCSS3aT8?g_st=iw" target="_blank" class="btn-location">
                📍 اضغط هنا للوصول للموقع
                <span class="btn-text-en">(Google Maps)</span>
            </a>
            
            <!-- النص في المنتصف تماماً -->
            <div style="text-align: center; width: 100%; margin-top: 3px;">
                <span class="footer-note">حضوركم يسعدنا، وبمشاركتكم تكتمل أفراحنا ومسرّاتنا ✨</span>
            </div>
        </div>
    </div>

</body>
</html>
