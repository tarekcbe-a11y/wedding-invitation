<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد بن محمد العدني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f8f3eb;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 10px;
            overflow: hidden;
        }
        .header-title {
            color: #b8860b;
            font-size: 18px;
            font-weight: bold;
        }
        .image-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 72vh;
            margin: 5px 0;
        }
        img.invite-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border: 1.5px solid #d4af37;
        }
        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .date-text {
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
        .map-btn {
            display: block;
            width: 85%;
            max-width: 300px;
            background-color: #d4af37;
            color: #fff;
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-title">✨ دعوة زفاف مباركة ✨</div>
    
    <div class="image-container">
        <img src="https://i.postimg.cc/N08NsqLg/ebb55242-d820-4ea0-9277-9c15fe071f5a.jpg" alt="دعوة زفاف أحمد العدني" class="invite-img">
    </div>
    
    <div class="footer-section">
        <div class="date-text">📅 06 / 11 / 2026 | 📍 الدمام</div>
        <a href="https://maps.app.goo.gl/" target="_blank" class="map-btn">موقع الحفل على خريطة جوجل</a>
    </div>

</body>
</html>
