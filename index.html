<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد بن محمد العدني</title>
    <style>
        body {
            background-color: #f8f3eb;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 90%;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 2px solid #d4af37;
        }
        img.invite-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #b8860b;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .map-btn {
            display: inline-block;
            background-color: #d4af37;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
            transition: background 0.3s ease;
        }
        .map-btn:hover {
            background-color: #b8860b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ دعوة زفاف مباركة ✨</h1>
        <p>يسعدنا حضوركم لتشريف حفل زفافنا الميمون</p>
        
        <!-- صورة الدعوة الجديدة -->
        <img src="https://i.postimg.cc/N08NsqLg/ebb55242-d820-4ea0-9277-9c15fe071f5a.jpg" alt="دعوة زفاف أحمد العدني" class="invite-img">
        
        <p><b>التاريخ:</b> 06 / 11 / 2026<br><b>المكان:</b> الدمام</p>
        
        <!-- زر موقع الحفل -->
        <a href="https://maps.app.goo.gl/" target="_blank" class="map-btn">📍 موقع الحفل على خريطة جوجل</a>
    </div>

</body>
</html>
